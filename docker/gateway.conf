server {
    listen 80;

    # Docker's embedded DNS (127.0.0.11) resolves compose service names. A bare
    # hostname in proxy_pass gets resolved once at config load via the container's
    # libc resolver, which on nginx:alpine (musl) can race the network being fully
    # wired up and fail permanently with "host not found in upstream" - crashing
    # nginx even though product-api/product-web are already up. Routing through a
    # variable forces nginx to resolve lazily per-request via this resolver
    # directive instead, which retries rather than failing once at startup.
    resolver 127.0.0.11 valid=10s;

    location /api/v1 {
        set $upstream_api  product-api:8080;
        proxy_pass         http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location / {
        set $upstream_web  product-web:80;
        proxy_pass         http://$upstream_web;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }
}
