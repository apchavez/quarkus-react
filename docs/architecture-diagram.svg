<svg viewBox="0 0 1180 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="420" fill="#f8fafc" />

  <text x="20" y="34" font-size="20" font-weight="700" fill="#0f172a">quarkus-react — Product Management Platform</text>
  <text x="20" y="56" font-size="13" fill="#64748b">Quarkus REST + React (Vite) + MongoDB + Redis + Kafka, Kubernetes</text>

  <g>
    <rect x="30" y="110" width="180" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" />
    <text x="120" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">React + Vite</text>
    <text x="120" y="158" text-anchor="middle" font-size="10.5" fill="#4338ca">Frontend (SPA)</text>
  </g>

  <g>
    <rect x="260" y="110" width="180" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
    <text x="350" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">nginx</text>
    <text x="350" y="158" text-anchor="middle" font-size="10" fill="#1e40af">reverse proxy</text>
  </g>

  <g>
    <rect x="490" y="110" width="200" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="590" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Quarkus REST</text>
    <text x="590" y="158" text-anchor="middle" font-size="10" fill="#166534">Backend</text>
  </g>

  <g>
    <rect x="750" y="110" width="180" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
    <text x="840" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">Redis</text>
    <text x="840" y="156" text-anchor="middle" font-size="10" fill="#991b1b">cache-aside + rate limit</text>
  </g>

  <g>
    <ellipse cx="590" cy="290" rx="110" ry="40" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
    <text x="590" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">MongoDB</text>
    <text x="590" y="303" text-anchor="middle" font-size="9.5" fill="#92400e">persistencia</text>
  </g>

  <g>
    <rect x="960" y="110" width="190" height="70" rx="10" fill="#fae8ff" stroke="#a21caf" stroke-width="1.5" />
    <text x="1055" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#701a75">Kafka</text>
    <text x="1055" y="156" text-anchor="middle" font-size="10" fill="#86198f">product-events</text>
  </g>

  <g>
    <rect x="30" y="330" width="1120" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="50" y="356" font-size="12" font-weight="700" fill="#0f172a">Notas de diseño</text>
    <text x="50" y="378" font-size="10.5" fill="#334155">Hexagonal (Ports &amp; Adapters): dominio con eventos propios (ProductEvent), caso de uso publica evento tras cada CUD. Frontend y backend contenerizados por separado, orquestados vía K8s o Docker Compose.</text>
  </g>

  <line x1="210" y1="145" x2="258" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="440" y1="145" x2="488" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="690" y1="145" x2="748" y2="145" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="590" y1="180" x2="590" y2="252" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="690" y1="130" x2="958" y2="130" stroke="#a21caf" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="695" y="122" font-size="9" fill="#86198f">eventos de dominio</text>

  <text x="20" y="415" font-size="10.5" fill="#94a3b8">Hermano de Product Management (5 stacks) — mismo dominio, mismo tópico Kafka product-events, distinto backend/frontend.</text>
</svg>
